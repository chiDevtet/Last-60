# CI for every pull request (and pushes to main): install from the lockfile, run the full test suite
# (unit + MongoDB replica-set integration tests), type-check every package and build the web app.
# Any failing step fails the workflow. Nothing here holds keys, sends transactions or deploys.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 22.04: MongoDB publishes 8.0.x server builds for this distro (used by the integration tests).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # The integration tests start their OWN single-node replica set (packages/engine/src/testing/mongod.ts,
      # required for multi-document transactions); mongodb-memory-server only downloads the binary.
      MONGOMS_VERSION: "8.0.4"
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongod-${{ runner.os }}-ubuntu2204-${{ env.MONGOMS_VERSION }}

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Explicit, named run of the accounting-safety suites (phase-aware revenue streams, funding
      # credits and round funding, CPMM creator_fee_on / CreatorFeeShare, migration verification,
      # immutable snapshots, dedicated payout wallet, custody transfers and attribution recovery). A
      # missing file fails this step. They run again in the full suite below.
      - name: Revenue, funding and migration verification suites
        run: >-
          bun test
          packages/engine/test/revenue-model.test.ts
          packages/engine/test/revenue-funding.test.ts
          packages/engine/test/cpmm-migration-hardening.test.ts
          packages/engine/test/forgepad-launchlab.test.ts
          packages/engine/test/migration.test.ts
          packages/engine/test/migration-attach.test.ts
          packages/engine/test/basis-guards.test.ts
          packages/engine/test/basis-history.test.ts
          packages/engine/test/config.test.ts
          packages/engine/test/forge-creator-distribution.test.ts
          packages/engine/test/approved-model.test.ts
          packages/engine/test/payout-wallet.test.ts
          packages/engine/test/custody.test.ts
          packages/engine/test/attribution-recovery.test.ts

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build web
        run: bun run build:web
